services:
    algo-viz:
        # Runs the image published by release.yml (CI-tested, smoke-tested) — nothing is built on the VPS.
        # Deploying or rolling back is just changing APP_VERSION in .env and re-running compose.
        image: ghcr.io/iamsarthakkr/algo-viz:${APP_VERSION:?set APP_VERSION in .env, e.g. 1.0.0}
        container_name: algo-viz
        # Bound to loopback only: Caddy on the host proxies to it. Publishing on 0.0.0.0 would
        # expose the port publicly, because Docker's iptables rules bypass ufw.
        # Default differs from the portfolio's port so both can run on the same VPS.
        ports:
            - '127.0.0.1:${HOST_PORT:-3002}:8080'
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8080/healthz']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s

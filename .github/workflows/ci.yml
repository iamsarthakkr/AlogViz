name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Lets release.yml run the exact same checks before publishing an image
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fails the job if coverage drops below the thresholds in vite.config.ts
      - name: Test with coverage
        run: npm run test:coverage

      # Type-checks src and tests (tsc -b) and produces the production bundle
      - name: Build
        run: npm run build

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: algo-viz:ci
          cache-from: type=gha,scope=algo-viz
          cache-to: type=gha,mode=max,scope=algo-viz

      # Catches what a successful build can't: a broken nginx.conf, a missing dist/,
      # hashed assets not being served, or the security headers going missing.
      - name: Smoke test container
        run: bash scripts/smoke-test.sh algo-viz:ci

      - name: Stop container
        if: always()
        run: docker rm -f algo-viz-smoke || true

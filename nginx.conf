server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy terminates TLS in front; don't leak the nginx version either way
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Declared at server level only: any add_header inside a location would stop these being inherited.
    # Everything (scripts, styles, fonts) is self-hosted, so the CSP can be same-origin only.
    # data: is allowed for images because daisyUI inlines a few small SVGs in its CSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Vite emits content-hashed filenames, so these can be cached forever
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deploys are picked up immediately.
    # Unknown paths fall back to it so a client-side router can be added later without nginx changes.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
